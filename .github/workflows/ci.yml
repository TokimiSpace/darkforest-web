name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DENO_NO_UPDATE_CHECK: "1"

jobs:
  verify:
    name: Deno and publication gates
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Deno
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: 2.5.6

      - name: Install locked dependencies
        run: deno install --frozen

      - name: Reject tracked generated or dependency directories
        shell: bash
        run: |
          if git ls-files | grep -E '(^|/)(node_modules|_fresh|build|coverage|dist|output|playwright-report|test-results|vendor)(/|$)'; then
            echo "Generated, dependency, or test-output directories must not be tracked."
            exit 1
          fi

      - name: Verify REUSE licensing metadata
        run: pipx run --spec 'reuse[charset-normalizer]==6.2.0' reuse lint

      - name: Verify public boundary
        run: deno run --allow-read=. scripts/publication_guard.ts

      - name: Verify static asset allowlist and hashes
        run: deno run --allow-read=. scripts/verify_assets.ts

      - name: Test the publication gates
        run: deno test --allow-read --allow-write --allow-env scripts/publication_checks_test.ts

      - name: Run project CI contract
        run: deno task ci

      - name: Reject lockfile drift
        run: git diff --exit-code -- deno.lock

      - name: Audit high-severity dependencies
        run: deno audit --frozen --level=high

  browser-qa:
    name: Browser QA
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Detect browser QA package
        id: qa
        shell: bash
        run: |
          if [[ -f qa/game-e2e/package-lock.json ]]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "qa/game-e2e is not present; browser QA is not part of this export yet."
          fi

      - name: Set up Deno
        if: steps.qa.outputs.enabled == 'true'
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: 2.5.6

      - name: Set up Node.js
        if: steps.qa.outputs.enabled == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: qa/game-e2e/package-lock.json

      - name: Install locked Deno dependencies
        if: steps.qa.outputs.enabled == 'true'
        run: deno install --frozen

      - name: Install locked QA dependencies without lifecycle scripts
        if: steps.qa.outputs.enabled == 'true'
        run: npm ci --ignore-scripts --omit=optional
        working-directory: qa/game-e2e

      - name: Audit QA dependencies
        if: steps.qa.outputs.enabled == 'true'
        run: npm audit --audit-level=high
        working-directory: qa/game-e2e

      - name: Install pinned Playwright Chromium
        if: steps.qa.outputs.enabled == 'true'
        run: npx --no-install playwright install --with-deps chromium
        working-directory: qa/game-e2e

      - name: Run desktop, portrait, landscape, and accessibility QA
        if: steps.qa.outputs.enabled == 'true'
        run: npm test
        working-directory: qa/game-e2e
