<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 1600 900"
  role="img"
  aria-labelledby="title desc"
>
  <title id="title">Darkforest abstract field</title>
  <desc id="desc">An original code-drawn placeholder for local fixture scenes.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#081111" />
      <stop offset=".52" stop-color="#14251f" />
      <stop offset="1" stop-color="#292117" />
    </linearGradient>
    <pattern id="grid" width="80" height="80" patternUnits="userSpaceOnUse">
